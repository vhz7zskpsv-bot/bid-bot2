<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Sniper Terminal</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #00ffcc;
            outline: none;
        }
        .btn-secondary {
            background: #333;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            margin-top: 5px;
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background: #222;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #121212;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #00cca3;
        }
        .console {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            font-size: 12px;
            color: #00ffcc;
            margin-top: 20px;
            border-radius: 4px;
        }
        .traits-box {
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #444;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SOLANA SNIPER TERMINAL</h2>
        
        <div class="form-group">
            <label>Magic Eden Collection Link / URL or Slug:</label>
            <input type="text" id="collectionInput" placeholder="e.g. https://magiceden.io/marketplace/y00ts">
            <button class="btn-secondary" onclick="fetchTraits()">Load Real Collection Traits</button>
        </div>

        <div class="form-group">
            <label>Select Traits (Fetched from Collection):</label>
            <div id="traitsContainer" class="traits-box">
                <span style="color: #777;">Enter link above and click 'Load Real Collection Traits'...</span>
            </div>
        </div>

        <div class="form-group">
            <label>Minimum Bid (SOL):</label>
            <input type="number" id="minBid" step="0.01" value="0.5">
        </div>

        <div class="form-group">
            <label>Maximum Bid (SOL):</label>
            <input type="number" id="maxBid" step="0.01" value="1.2">
        </div>

        <div class="form-group">
            <label>Quantity:</label>
            <input type="number" id="quantity" value="5">
        </div>

        <div class="form-group">
            <label>Solana Private Key (Base58):</label>
            <input type="password" id="privateKey" placeholder="Enter private key securely">
        </div>

        <button onclick="launchBot()">Launch Sniper Bot</button>

        <div class="console" id="consoleLog">
            [ System Ready. Enter collection link & load traits... ]
        </div>
    </div>

    <script>
        function getCleanSlug() {
            let inputVal = document.getElementById('collectionInput').value.trim();
            if (!inputVal) return '';
            if (inputVal.includes('magiceden.io')) {
                const parts = inputVal.split('/');
                return parts[parts.length - 1] || parts[parts.length - 2];
            }
            return inputVal;
        }

        async function fetchTraits() {
            const slug = getCleanSlug();
            const consoleLog = document.getElementById('consoleLog');
            const traitsContainer = document.getElementById('traitsContainer');

            if (!slug) {
                consoleLog.innerHTML += "<br><span style='color: #ff4444;'>[Error] Please enter a valid Collection link or slug first!</span>";
                return;
            }

            consoleLog.innerHTML += `<br>[Fetching] Loading real traits for: ${slug}...`;
            traitsContainer.innerHTML = "<span style='color: #ffcc00;'>Fetching traits from Magic Eden...</span>";

            try {
                // Using CORS proxy to successfully fetch real attributes from Magic Eden API
                const targetUrl = `https://api-mainnet.magiceden.dev/v2/collections/${slug}/attributes`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Failed to fetch traits");
                
                const textData = await response.text();
                const data = JSON.parse(textData);

                if (data && Array.isArray(data) && data.length > 0) {
                    let html = '';
                    data.forEach((attr, idx) => {
                        const traitText = `${attr.trait_type}: ${attr.value}`;
                        html += `<div style="margin-bottom: 6px;">
                            <input type="checkbox" name="traitCheck" value="${traitText}" id="trait_${idx}">
                            <label for="trait_${idx}" style="display:inline; color:#fff; cursor:pointer;"> ${traitText}</label>
                        </div>`;
                    });
                    traitsContainer.innerHTML = html;
                    consoleLog.innerHTML += "<br><span style='color: #00ffcc;'>[Success] Real traits loaded successfully! Check desired ones.</span>";
                } else {
                    traitsContainer.innerHTML = "<span style='color: #ffcc00;'>No specific traits found for this collection (Floor bidding mode).</span>";
                    consoleLog.innerHTML += "<br><span style='color: #ffcc00;'>[Notice] Collection has no attribute filters.</span>";
                }
            } catch (error) {
                consoleLog.innerHTML += "<br><span style='color: #ff4444;'>[Error] Could not fetch traits. Check collection slug/link.</span>";
                traitsContainer.innerHTML = "<span style='color: #ff4444;'>Failed to load. Please check the collection link and try again.</span>";
            }
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function launchBot() {
            const slug = getCleanSlug();
            const minBid = document.getElementById('minBid').value;
            const maxBid = document.getElementById('maxBid').value;
            const quantity = document.getElementById('quantity').value;
            const privateKey = document.getElementById('privateKey').value;
            const consoleLog = document.getElementById('consoleLog');

            let selectedTraits = [];
            document.querySelectorAll('input[name="traitCheck"]:checked').forEach((checkbox) => {
                selectedTraits.push(checkbox.value);
            });

            if (!slug || !privateKey) {
                consoleLog.innerHTML += "<br><span style='color: #ff4444;'>[Error] Please fill Collection and Private Key!</span>";
                return;
            }

            consoleLog.innerHTML += `<br>[Initializing] Target Collection: ${slug}`;
            if (selectedTraits.length > 0) {
                consoleLog.innerHTML += `<br>[Filter] Selected Traits: ${selectedTraits.join(', ')}`;
            } else {
                consoleLog.innerHTML += `<br>[Filter] Mode: Floor Bidding (No traits selected)`;
            }
            consoleLog.innerHTML += `<br>[Config] Bidding between ${minBid} - ${maxBid} SOL (Qty: ${quantity})`;
            consoleLog.innerHTML += "<br><span style='color: #00ffcc;'>[Connecting] Secure connection established with Solana RPC...</span>";
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>

</body>
</html>
