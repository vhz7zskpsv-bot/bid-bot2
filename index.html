<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Sniper Terminal</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            border-color: #00ffcc;
            outline: none;
        }
        .traits-box {
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 13px;
        }
        .trait-pill {
            display: inline-block;
            background: #333;
            color: #00ffcc;
            padding: 5px 10px;
            border-radius: 4px;
            margin: 3px;
            cursor: pointer;
            border: 1px solid #00ffcc55;
            font-size: 12px;
        }
        .trait-pill:hover {
            background: #00ffcc;
            color: #121212;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #121212;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #00cca3;
        }
        .console {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            font-size: 12px;
            color: #00ffcc;
            margin-top: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SOLANA SNIPER TERMINAL</h2>
        
        <div class="form-group">
            <label>Magic Eden Collection Link / URL or Slug:</label>
            <input type="text" id="collectionInput" placeholder="e.g. https://magiceden.io/marketplace/y00ts">
        </div>

        <div class="form-group">
            <label>Target Traits (Click to add or type custom):</label>
            <div class="traits-box" style="margin-bottom: 8px;">
                <span class="trait-pill" onclick="addTrait('Gold Eyes')">+ Gold Eyes</span>
                <span class="trait-pill" onclick="addTrait('Laser Eyes')">+ Laser Eyes</span>
                <span class="trait-pill" onclick="addTrait('Crown')">+ Crown</span>
                <span class="trait-pill" onclick="addTrait('Legendary')">+ Legendary</span>
                <span class="trait-pill" onclick="addTrait('Diamond Skin')">+ Diamond Skin</span>
            </div>
            <input type="text" id="traits" placeholder="e.g. Gold Eyes, Crown (Comma separated)">
        </div>

        <div class="form-group">
            <label>Minimum Bid (SOL):</label>
            <input type="number" id="minBid" step="0.01" value="0.5">
        </div>

        <div class="form-group">
            <label>Maximum Bid (SOL):</label>
            <input type="number" id="maxBid" step="0.01" value="1.2">
        </div>

        <div class="form-group">
            <label>Quantity:</label>
            <input type="number" id="quantity" value="5">
        </div>

        <div class="form-group">
            <label>Solana Private Key (Base58):</label>
            <input type="password" id="privateKey" placeholder="Enter private key securely">
        </div>

        <button onclick="launchBot()">Launch Sniper Bot</button>

        <div class="console" id="consoleLog">
            [ System Ready. Enter collection link and details... ]
        </div>
    </div>

    <script>
        function addTrait(traitName) {
            const traitsInput = document.getElementById('traits');
            if (traitsInput.value.trim() === '') {
                traitsInput.value = traitName;
            } else {
                traitsInput.value += ', ' + traitName;
            }
        }

        function launchBot() {
            let inputVal = document.getElementById('collectionInput').value.trim();
            const traits = document.getElementById('traits').value;
            const minBid = document.getElementById('minBid').value;
            const maxBid = document.getElementById('maxBid').value;
            const quantity = document.getElementById('quantity').value;
            const privateKey = document.getElementById('privateKey').value;
            const consoleLog = document.getElementById('consoleLog');

            if (!inputVal || !privateKey) {
                consoleLog.innerHTML += "<br><span style='color: #ff4444;'>[Error] Please fill Collection Link/Slug and Private Key!</span>";
                return;
            }

            let collectionSlug = inputVal;
            if (inputVal.includes('magiceden.io')) {
                const parts = inputVal.split('/');
                collectionSlug = parts[parts.length - 1] || parts[parts.length - 2];
            }

            consoleLog.innerHTML += `<br>[Initializing] Target Collection: ${collectionSlug}`;
            if (traits) {
                consoleLog.innerHTML += `<br>[Filter] Target Traits: ${traits}`;
            } else {
                consoleLog.innerHTML += `<br>[Filter] Mode: Floor Bidding (No traits selected)`;
            }
            consoleLog.innerHTML += `<br>[Config] Bidding between ${minBid} - ${maxBid} SOL (Qty: ${quantity})`;
            consoleLog.innerHTML += "<br><span style='color: #00ffcc;'>[Connecting] Secure connection established with Solana RPC...</span>";
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>

</body>
</html>
